name: CI

# Dois niveis de teste, em jobs separados de proposito:
#
#   testes-unitarios  - logica pura, sem subir cena. Roda em segundos e diz
#                       "a conta esta certa?".
#   teste-de-fumaca   - sobe o jogo inteiro sem janela, percorre o andar, mata
#                       o chefe. Diz "a run inteira funciona?".
#   combinacoes       - poe dois e cinco inimigos na mesma sala e mede se ainda
#                       ha para onde correr. Diz "isso e justo?".
#
# Separados porque quebram por motivos diferentes: quando o unitario falha voce
# sabe que e logica, sem precisar ler o log de gameplay inteiro. E o unitario
# termina antes, entao o erro mais barato aparece primeiro.
#
# O de combinacoes existe separado porque precisa de TEMPO DE RELOGIO: o Hacker
# Parasita leva mais de um segundo entre nascer e semear, e o teste de fumaca
# mata tudo a cada 0,12 s -- em tres runs seguidas ele apareceu e zero areas
# foram criadas. Ciclo longo nao cabe nem no runner de segundos nem no fumaca.

on:
  push:
    branches: [main]
  pull_request:

env:
  # Tem de casar com o config/features do project.godot e com o release.yml.
  # Fixada na versao EXATA do editor instalado na maquina do time. Enquanto o
  # CI rodou 4.6 e o editor 4.7, um recurso de 4.7 passava local e quebrava no
  # PR -- e, pior, a build que ia para o testador saia de um Godot que nao era
  # o que abriu o projeto.
  GODOT_VERSAO: 4.7.2-stable

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest
    # Logica pura roda em segundos. Se passar disso e porque travou -- melhor
    # falhar rapido do que segurar o runner ate o limite padrao de 6h.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # As imagens do menu estao em LFS. Sem isto o checkout traz
          # ponteiros de texto e o Godot importa arte quebrada.
          lfs: true

      - name: Baixar Godot ${{ env.GODOT_VERSAO }}
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSAO}/Godot_v${GODOT_VERSAO}_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$URL"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSAO}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --headless --version

      - name: Importar o projeto
        run: godot --headless --path . --import

      - name: Testes unitarios
        run: godot --headless --path . tools/testes/runner.tscn

  teste-de-fumaca:
    runs-on: ubuntu-latest
    # O proprio teste ja tem TEMPO_LIMITE interno; isto cobre o caso de o
    # processo travar antes de chegar la.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # As imagens do menu estao em LFS. Sem isto o checkout traz
          # ponteiros de texto e o Godot importa arte quebrada.
          lfs: true

      - name: Baixar Godot ${{ env.GODOT_VERSAO }}
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSAO}/Godot_v${GODOT_VERSAO}_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$URL"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSAO}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --headless --version

      - name: Importar o projeto
        # A primeira importacao gera .godot/. Roda em passo separado para que
        # um erro de importacao apareca como erro de importacao, e nao como
        # falha misteriosa do teste.
        run: godot --headless --path . --import

      - name: Teste de fumaca
        run: godot --headless --path . tools/teste_fumaca.tscn

  combinacoes:
    runs-on: ubuntu-latest
    # Cada combinacao roda 8 s de relogio em quatro valores de barra: 20
    # cenarios, ~3 min. O tempo de relogio e o ponto -- o Parasita leva mais de
    # um segundo entre nascer e semear, e e justamente o que o teste de fumaca
    # nao alcanca.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Baixar Godot ${{ env.GODOT_VERSAO }}
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSAO}/Godot_v${GODOT_VERSAO}_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$URL"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSAO}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --headless --version

      - name: Importar o projeto
        run: godot --headless --path . --import

      - name: Combinacoes de inimigo
        run: godot --headless --path . tools/combinacoes/combinacoes.tscn
