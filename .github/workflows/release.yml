name: Release

# Gera as builds de Windows e Web e publica numa GitHub Release.
#
# Dispara de duas formas:
#   - empurrando uma tag v* (ex.: v0.1.0-alpha)  -> publica a release
#   - manualmente pela aba Actions                -> so gera os artefatos
#
# Por que o teste de fumaca roda aqui de novo, se ja rodou no PR: a tag pode
# apontar para qualquer commit. Publicar uma build sem reconferir seria confiar
# que o commit tagueado e exatamente o que passou no PR -- e nao e sempre.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Mesma versao do ci.yml. Se mudar aqui, mude la tambem -- e mude o
  # config/features do project.godot junto.
  GODOT_VERSAO: 4.6-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Baixar Godot ${{ env.GODOT_VERSAO }}
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSAO}/Godot_v${GODOT_VERSAO}_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$URL"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSAO}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --headless --version

      - name: Baixar os export templates
        # Sem os templates a exportacao falha dizendo que nao encontrou o
        # template. Vao para o caminho que o Godot procura, que inclui o
        # numero da versao sem o sufixo "-stable".
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSAO}/Godot_v${GODOT_VERSAO}_export_templates.tpz"
          curl -fsSL -o templates.tpz "$URL"
          unzip -q templates.tpz
          DESTINO="$HOME/.local/share/godot/export_templates/${GODOT_VERSAO%-stable}.stable"
          mkdir -p "$DESTINO"
          mv templates/* "$DESTINO/"
          ls "$DESTINO" | head

      - name: Preparar rcedit para o export de Windows
        # A preset de Windows preenche application/product_name, o que faz o
        # Godot querer reescrever os metadados do .exe. No Linux isso depende de
        # rcedit rodando sob wine; sem os dois o export falha. Instalar e mais
        # simples que limpar os campos e perder o nome no Explorer.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 > /dev/null
          mkdir -p "$HOME/.local/share/rcedit"
          curl -fsSL -o "$HOME/.local/share/rcedit/rcedit-x64.exe" \
            https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/windows/rcedit = "~/.local/share/rcedit/rcedit-x64.exe"
          export/windows/wine = "/usr/bin/wine64"
          EOF

      - name: Importar o projeto
        # Primeira importacao gera .godot/. Em passo separado para que um erro
        # de importacao apareca como erro de importacao.
        run: godot --headless --path . --import

      - name: Testes unitarios
        run: godot --headless --path . tools/testes/runner.tscn

      - name: Teste de fumaca
        run: godot --headless --path . tools/teste_fumaca.tscn

      - name: Exportar Web
        # O Godot devolve 0 mesmo com erro de export em algumas versoes, entao
        # quem decide se deu certo e a existencia do arquivo.
        run: |
          set -euo pipefail
          mkdir -p builds/web
          godot --headless --path . --export-release "Web" builds/web/index.html
          test -s builds/web/index.html || { echo "::error::export web nao gerou index.html"; exit 1; }
          test -s builds/web/index.wasm || { echo "::error::export web nao gerou o .wasm"; exit 1; }
          ls -lh builds/web

      - name: Exportar Windows
        run: |
          set -euo pipefail
          mkdir -p builds/windows
          godot --headless --path . --export-release "Windows Desktop" builds/windows/psicode.exe
          test -s builds/windows/psicode.exe || { echo "::error::export windows nao gerou o .exe"; exit 1; }
          ls -lh builds/windows

      - name: Empacotar
        # O zip da web tem o index.html na RAIZ, que e o que o itch.io exige
        # para rodar no navegador.
        run: |
          set -euo pipefail
          (cd builds/web && zip -qr ../../psicode-web.zip .)
          (cd builds/windows && zip -qr ../../psicode-windows.zip .)
          ls -lh psicode-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: psicode-builds
          path: psicode-*.zip
          retention-days: 30

      - name: Publicar a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            psicode-web.zip psicode-windows.zip \
            --title "psicode ${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease
